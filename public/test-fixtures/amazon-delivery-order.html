<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Orders - Amazon.in</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #eaeded;
      margin: 0;
      padding: 30px;
      display: flex;
      justify-content: center;
    }
    .order-card {
      background: #ffffff;
      border: 1px solid #d5d9d9;
      border-radius: 8px;
      max-width: 640px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .order-header {
      background: #f0f2f2;
      border-bottom: 1px solid #d5d9d9;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #565959;
    }
    .order-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .delivery-status {
      font-size: 16px;
      font-weight: 700;
      color: #007600;
    }
    .product-title {
      font-size: 15px;
      font-weight: 600;
      color: #0f1111;
      line-height: 1.4;
    }
    .return-policy {
      font-size: 13px;
      color: #565959;
      background: #f7fafa;
      border: 1px solid #d5d9d9;
      border-radius: 6px;
      padding: 10px 14px;
    }
    .return-highlight {
      color: #b12704;
      font-weight: 600;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #d5d9d9;
      background: #ffd814;
      color: #0f1111;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="order-card">
    <div class="order-header">
      <div>
        <span>ORDER PLACED: </span><strong>October 2, 2026</strong>
      </div>
      <div>
        <span>ORDER # </span><strong>403-8829103-9182301</strong>
      </div>
    </div>
    <div class="order-body">
      <div class="delivery-status">Delivered October 6, 2026</div>
      <p style="margin: 0; font-size: 13px; color: #565959;">Package was delivered to resident.</p>
      
      <div class="product-title">
        Sony WH-1000XM5 Wireless Industry Leading Noise Canceling Headphones
      </div>

      <div class="return-policy">
        Return or replace items: <span class="return-highlight">Eligible through October 16, 2026</span>
      </div>

      <div class="button-group">
        <button class="btn">Return or replace items</button>
        <button class="btn" style="background: #ffffff;">Share gift receipt</button>
      </div>
    </div>
  </div>
</body>
</html>
